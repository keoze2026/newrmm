name: Build agents

# Specification section 6: "Build/CI: automated per-OS builds producing signed
# installers", and section 8: "Every platform build is reproducible from CI and
# installs without manual steps."
#
# PyInstaller cannot cross-compile, so each agent is built on its own runner,
# together with the native capture module that platform needs - C on Linux,
# Rust on Windows, Swift on macOS.
#
# Signing runs only when the certificates are present as repository secrets.
# Without them the job still produces a working unsigned build and says so,
# rather than failing and leaving nothing to test with.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agents.yml'

jobs:
  linux:
    name: Linux agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk libx11-dev libxext-dev libxrandr-dev libpipewire-0.3-dev \
            gir1.2-appindicator3-0.1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller

      - name: Native capture module (C, X11 XShm / PipeWire)
        working-directory: agent/native/linux
        run: |
          python setup.py build_ext --inplace
          ls -la *.so

      - name: Build
        working-directory: agent
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-linux
          path: agent/dist/rmm-agent-linux
          if-no-files-found: error

  windows:
    name: Windows agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller maturin

      - name: Native capture module (Rust, Windows.Graphics.Capture)
        working-directory: agent/native/windows
        run: |
          maturin build --release
          Copy-Item target\wheels\*.whl -Destination . -ErrorAction SilentlyContinue
          pip install --no-index --find-links target\wheels rmm_capture_windows
        shell: pwsh

      - name: Build
        working-directory: agent
        run: python build.py

      - name: Sign
        # Only with a certificate in the repository's secrets. An unsigned
        # build still ships, and SmartScreen will warn about it.
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
            /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            agent\dist\rmm-agent-windows.exe
          Remove-Item cert.pfx
        shell: pwsh

      - name: Note when unsigned
        if: ${{ env.WINDOWS_CERT_PFX == '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: echo "::warning::No signing certificate; this build is unsigned and SmartScreen will warn."
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-windows
          path: agent/dist/rmm-agent-windows.exe
          if-no-files-found: error

  macos:
    name: macOS agent
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller pyobjc-framework-Cocoa

      - name: Native capture module (Swift, ScreenCaptureKit)
        working-directory: agent/native/macos
        run: ./build.sh

      - name: Build
        working-directory: agent
        run: python build.py --app

      - name: Sign and notarise
        # Needs a Developer ID certificate and an App Store Connect key.
        # Without them the build is unsigned and Gatekeeper will refuse it on
        # any machine other than the one that built it.
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" agent/dist/rmm-agent-macos
          rm cert.p12
          if [ -n "$MACOS_NOTARY_PROFILE" ]; then
            ditto -c -k --keepParent agent/dist/rmm-agent-macos notarise.zip
            xcrun notarytool submit notarise.zip \
              --keychain-profile "$MACOS_NOTARY_PROFILE" --wait
          fi

      - name: Note when unsigned
        if: ${{ env.MACOS_CERT_P12 == '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: echo "::warning::No Developer ID certificate; this build is unsigned and Gatekeeper will refuse it."

      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-macos
          path: agent/dist/rmm-agent-macos
          if-no-files-found: error

  release:
    name: Collect
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum * | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Endpoint agents for Windows, macOS and Linux, each built on its own
            platform with that platform's native capture module.

            Verify a download against `SHA256SUMS`, and against the checksum the
            relay reports at `/api/connector`.
