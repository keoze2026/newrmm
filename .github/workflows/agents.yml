name: Build agents

# Specification section 6: "Build/CI: automated per-OS builds producing signed
# installers", and section 8: "Every platform build is reproducible from CI and
# installs without manual steps."
#
# PyInstaller cannot cross-compile, so each agent is built on its own runner,
# together with the native capture module that platform needs - C on Linux,
# Rust on Windows, Swift on macOS.
#
# Signing runs only when the certificates are present as repository secrets.
# Without them the job still produces a working unsigned build and says so,
# rather than failing and leaving nothing to test with.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agents.yml'

jobs:
  linux:
    name: Linux agent
    # Pinned, not ubuntu-latest: the agent bundles the build machine's own
    # libraries, so a newer machine makes an agent that older systems cannot
    # run. ubuntu-latest became 26.04 (glibc 2.42) and the bundled Tcl library
    # then failed on a glibc 2.41 laptop: no consent window, so the agent
    # refused its own session and exited straight after install.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk libx11-dev libxext-dev libxrandr-dev libxfixes-dev \
            gir1.2-appindicator3-0.1 \
            libgirepository1.0-dev gobject-introspection libcairo2-dev pkg-config \
            gir1.2-glib-2.0 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire \
            python3-gi xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Python 3.13 no longer bundles setuptools, and setup.py needs it.
          pip install setuptools
          pip install -r agent/requirements.txt pyinstaller

      - name: Native capture module (C, X11 XShm)
        working-directory: agent/native/linux
        run: |
          python setup.py build_ext --inplace
          ls -la *.so

      - name: Build
        working-directory: agent
        env:
          # The server the agent talks to, built in so nobody has to type it.
          # Override with a repository variable named RMM_DEFAULT_RELAY.
          RMM_DEFAULT_RELAY: ${{ vars.RMM_DEFAULT_RELAY || 'wss://rmm.remotedesk247.com/api' }}
        run: python build.py

      - name: Check the built agent can share a Wayland screen
        # Wayland capture runs in rmm_agent/wayland_helper.py under the
        # machine's own python3. Fail the build if the helper is not inside
        # the binary or cannot reach the system's PyGObject and GStreamer
        # pipewire plugin - the agent used to ship with no Wayland path at
        # all and nothing noticed. jpegenc (gstreamer1.0-plugins-good) is
        # required too: the capture pipeline compresses each frame with it, so
        # a build whose status does not report it would stream nothing on
        # Wayland (lesson #51 - check the built artefact, not the source).
        run: |
          set -o pipefail
          timeout 120 xvfb-run -a agent/dist/rmm-agent-linux status | tee status.txt
          grep -E '^wayland +: helper bundled, .*PyGObject yes, .*pipewiresrc yes, jpegenc yes' status.txt

      - name: Package (.deb)
        # Section 8: "installs without manual steps". A bare executable does
        # not install; the package does.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Every build needs its own number: apt skips "0.2.0" over an
          # installed "0.2.0", so a fixed build never replaced the old one.
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.2.0.${GITHUB_RUN_NUMBER}" ;; esac
          ./installers/linux/build_deb.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-linux
          path: |
            agent/dist/rmm-agent-linux
            agent/dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows agent
    runs-on: windows-latest
    # GitHub Actions evaluates a step's `if:` before that step's own `env:`
    # block is applied, so checking `env.WINDOWS_CERT_PFX` only inside the
    # Sign/Note-when-unsigned steps themselves (as this used to) meant it was
    # always unset at the point the `if:` was evaluated - the Sign step could
    # never run and the unsigned warning fired unconditionally, no matter
    # what secrets were configured in the repository. Setting it at job level
    # makes it visible to `if:` too.
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller maturin

      - name: Native capture module (Rust, Windows.Graphics.Capture)
        working-directory: agent/native/windows
        run: |
          maturin build --release
          Copy-Item target\wheels\*.whl -Destination . -ErrorAction SilentlyContinue
          pip install --no-index --find-links target\wheels rmm_capture_windows
        shell: pwsh

      - name: Build
        working-directory: agent
        env:
          # The server the agent talks to, built in so nobody has to type it.
          # Override with a repository variable named RMM_DEFAULT_RELAY.
          RMM_DEFAULT_RELAY: ${{ vars.RMM_DEFAULT_RELAY || 'wss://rmm.remotedesk247.com/api' }}
        run: python build.py

      - name: The Rust capture module is inside the built agent
        # The agent falls back to mss without saying so loudly; a build that
        # ships without the native module must fail here, not on a customer.
        shell: pwsh
        run: |
          $agent = (Resolve-Path "agent\dist\rmm-agent.exe").Path
          $p = Start-Process -FilePath $agent -ArgumentList "status" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "status did not finish"; exit 1 }
          $log = Join-Path $env:APPDATA "RMMAgent\agent.log"
          if (-not (Test-Path $log)) { Write-Error "the agent wrote no log at $log"; exit 1 }
          Select-String -Path $log -Pattern "native|capturing" | ForEach-Object { $_.Line }
          if (Select-String -Path $log -Pattern "no native capture module" -Quiet) {
            Write-Error "the built agent has no native capture module"; exit 1
          }

      - name: Installer (Inno Setup)
        # Section 8: "installs without manual steps". Produces
        # agent\dist\rmm-agent-setup.exe, which installs the agent and puts it
        # on PATH.
        run: |
          choco install innosetup -y --no-progress
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          if (-not ($version -match '^\d+\.\d+\.\d+')) { $version = "0.2.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installers\windows\rmm-agent.iss
          Get-Item agent\dist\rmm-agent-setup.exe
        shell: pwsh

      - name: Sign
        # Only with a certificate in the repository's secrets. An unsigned
        # build still ships, and SmartScreen will warn about it.
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
            /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            agent\dist\rmm-agent-windows.exe agent\dist\rmm-agent-watchdog.exe agent\dist\rmm-agent-setup.exe
          Remove-Item cert.pfx
        shell: pwsh

      - name: Note when unsigned
        if: ${{ env.WINDOWS_CERT_PFX == '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: echo "::warning::No signing certificate; this build is unsigned and SmartScreen will warn."
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-windows
          path: |
            agent/dist/rmm-agent-windows.exe
            agent/dist/rmm-agent-watchdog.exe
            agent/dist/rmm-agent-setup.exe
          if-no-files-found: error

  macos:
    name: macOS agent
    # macos-14 was removed from GitHub's hosted-runner fleet ("configuration
    # 'macos-14-arm64-us-default' is not supported", 2026-11-06 run), failing
    # in 1s before any step ran - nothing to do with this repo's code.
    runs-on: macos-15
    # Same reasoning as the Windows job above: `if:` is evaluated before a
    # step's own `env:`, so this must be set at job level or Sign-and-notarise
    # could never run no matter what secrets exist.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller pyobjc-framework-Cocoa

      - name: Native capture module (Swift, ScreenCaptureKit)
        working-directory: agent/native/macos
        run: ./build.sh

      - name: Build
        working-directory: agent
        env:
          # The server the agent talks to, built in so nobody has to type it.
          # Override with a repository variable named RMM_DEFAULT_RELAY.
          RMM_DEFAULT_RELAY: ${{ vars.RMM_DEFAULT_RELAY || 'wss://rmm.remotedesk247.com/api' }}
        run: python build.py --app

      - name: The Swift capture module is inside the built agent
        # Lesson #33: a named component is not delivered until the finished
        # agent is checked for it. The agent falls back to mss without saying
        # so loudly, so a build that ships without the native module fails here.
        run: |
          APP="agent/dist/rmm-agent.app/Contents/MacOS/rmm-agent"
          "$APP" status & pid=$!
          ( sleep 120; kill -9 $pid 2>/dev/null ) &
          status=0; wait $pid || status=$?
          if [ "$status" -ge 128 ]; then
            echo "::error::the built agent crashed (exit $status)"; exit 1
          fi
          LOG="$HOME/Library/Application Support/RMMAgent/agent.log"
          test -f "$LOG" || { echo "::error::the agent wrote no log at $LOG"; exit 1; }
          grep -i "native\|capturing" "$LOG" || true
          if grep -q "no native capture module" "$LOG"; then
            echo "::error::the built agent has no native capture module"; exit 1
          fi

      - name: Installer (.pkg)
        # Runs installers/macos/build_pkg.sh once that script exists. Until
        # then the zipped .app is what ships, and this says so rather than
        # failing the build.
        run: |
          if [ -x installers/macos/build_pkg.sh ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            case "$VERSION" in [0-9]*) ;; *) VERSION="0.2.0" ;; esac
            ./installers/macos/build_pkg.sh "$VERSION"
          else
            echo "::warning::installers/macos/build_pkg.sh is missing; shipping the zipped .app only."
          fi

      - name: Sign and notarise
        # Needs a Developer ID certificate and an App Store Connect key.
        # Without them the build is unsigned and Gatekeeper will refuse it on
        # any machine other than the one that built it.
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" agent/dist/rmm-agent.app
          rm cert.p12
          # Re-archive after signing, then notarise the signed bundle.
          rm -f agent/dist/rmm-agent-macos.zip
          ditto -c -k --keepParent agent/dist/rmm-agent.app agent/dist/rmm-agent-macos.zip
          if [ -n "$MACOS_NOTARY_PROFILE" ]; then
            xcrun notarytool submit agent/dist/rmm-agent-macos.zip \
              --keychain-profile "$MACOS_NOTARY_PROFILE" --wait
            xcrun stapler staple agent/dist/rmm-agent.app
            rm -f agent/dist/rmm-agent-macos.zip
            ditto -c -k --keepParent agent/dist/rmm-agent.app agent/dist/rmm-agent-macos.zip
          fi

      - name: Note when unsigned
        if: ${{ env.MACOS_CERT_P12 == '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: echo "::warning::No Developer ID certificate; this build is unsigned and Gatekeeper will refuse it."

      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-macos
          path: |
            agent/dist/rmm-agent-macos.zip
            agent/dist/*.pkg
          if-no-files-found: error

  release:
    name: Collect
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum * | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Endpoint agents for Windows, macOS and Linux, each built on its own
            platform with that platform's native capture module.

  deliver:
    name: Deliver to the server
    # Only after all three platforms built GREEN, and only for a push to main
    # (not tags, not pull requests). `needs` is what guarantees a failed or
    # partial build never reaches the server: if any build job fails, this job
    # does not run, so the working copy on the server is left untouched.
    needs: [linux, windows, macos]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      # Job-level so step `if:` can see it (the `secrets` context is not
      # available in `if:` directly). Empty until the one-time admin step adds
      # the SERVER_SSH_KEY secret; delivery is skipped (with a warning) until then.
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_HOST: rmm.remotedesk247.com
      SERVER_USER: root
      DIST: /opt/nermm/agent/dist
    steps:
      - name: Skip until the deploy key is set
        if: ${{ env.SERVER_SSH_KEY == '' }}
        run: echo "::warning::SERVER_SSH_KEY is not set yet, so automatic delivery is skipped. Add it once (admin step) to turn delivery on."

      - name: Download every built agent
        if: ${{ env.SERVER_SSH_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect all three platforms, refuse a partial set
        if: ${{ env.SERVER_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p deliver
          cp -v incoming/rmm-agent-linux/*   deliver/
          cp -v incoming/rmm-agent-windows/* deliver/
          cp -v incoming/rmm-agent-macos/*   deliver/
          # Belt and braces on top of `needs`: every platform's key file must be
          # present or we deliver nothing.
          ls deliver/rmm-agent_*_amd64.deb >/dev/null || { echo "::error::Linux .deb missing"; exit 1; }
          test -f deliver/rmm-agent-setup.exe || { echo "::error::Windows installer missing"; exit 1; }
          test -f deliver/rmm-agent-macos.zip || { echo "::error::macOS build missing"; exit 1; }
          NEWDEB="$(basename deliver/rmm-agent_*_amd64.deb)"
          echo "NEWDEB=$NEWDEB" >> "$GITHUB_ENV"
          echo "Delivering this set:"; ls -la deliver

      - name: Open an SSH connection to the server
        if: ${{ env.SERVER_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          # The secret may be the raw key or a single-line base64 of it. Base64
          # is preferred: a raw multi-line key often loses its line breaks when
          # pasted into a secret, and OpenSSH then rejects it ("error in
          # libcrypto"). Detect which we got and write a valid key file.
          if printf '%s' "$SERVER_SSH_KEY" | head -n1 | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          else
            printf '%s' "$SERVER_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null \
            || { echo "::error::SERVER_SSH_KEY is not a valid private key. Store the single-line base64 version (on the server: base64 -w0 /root/.ssh/gh_deploy)."; exit 1; }
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deliver atomically, keeping the old build as a backup
        if: ${{ env.SERVER_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          SSHOPTS="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          TARGET="$SERVER_USER@$SERVER_HOST"
          # Stage the new files on the server first, well away from the live folder.
          ssh $SSHOPTS "$TARGET" 'rm -rf /opt/nermm/agent/incoming && mkdir -p /opt/nermm/agent/incoming /opt/nermm/agent/dist /opt/nermm/agent/backup'
          scp $SSHOPTS deliver/* "$TARGET:/opt/nermm/agent/incoming/"
          # Back up the current live build, then overlay the new files in place
          # (in place, never a directory swap: the live folder is bind-mounted
          # into the relay container). Finally drop stale .debs so only the new
          # version remains. prev/ is the rollback copy.
          ssh $SSHOPTS "$TARGET" NEWDEB="$NEWDEB" bash -s <<'REMOTE'
          set -e
          rm -rf /opt/nermm/agent/backup/prev
          cp -a /opt/nermm/agent/dist /opt/nermm/agent/backup/prev
          cp -af /opt/nermm/agent/incoming/. /opt/nermm/agent/dist/
          cd /opt/nermm/agent/dist
          for f in rmm-agent_*_amd64.deb; do [ "$f" = "$NEWDEB" ] || rm -f "$f"; done
          rm -rf /opt/nermm/agent/incoming
          echo "Live folder now:"; ls -la /opt/nermm/agent/dist
          REMOTE

      - name: Prove the live download serves the new version
        if: ${{ env.SERVER_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          # The Linux download's filename carries the version; it must match what
          # we just delivered, or the delivery did not really take.
          headers="$(curl -fsS -D - -o /dev/null "https://$SERVER_HOST/api/connector/linux")"
          echo "$headers" | tr -d '\r' | grep -i '^content-disposition:' || true
          echo "$headers" | tr -d '\r' | grep -i '^content-disposition:' | grep -q "$NEWDEB" \
            || { echo "::error::Live Linux download is NOT serving $NEWDEB"; exit 1; }
          # Windows and macOS: confirm the live link hands over the file (one byte is enough).
          curl -fsS -r 0-0 -o /dev/null "https://$SERVER_HOST/api/connector/windows"
          curl -fsS -r 0-0 -o /dev/null "https://$SERVER_HOST/api/connector/macos"
          echo "Verified live: Linux serving $NEWDEB; Windows and macOS reachable."
