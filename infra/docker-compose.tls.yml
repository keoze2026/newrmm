# TLS overlay for the compose stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Mount real certificates at ./certs/fullchain.pem and ./certs/privkey.pem.
# Section 11 of the specification assumes a public domain and a certificate are
# available; docs/DEPLOYMENT.md covers obtaining them with certbot.

services:
  console:
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-webroot:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"

  relay:
    environment:
      # The console is served over https, so its origin is too.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
