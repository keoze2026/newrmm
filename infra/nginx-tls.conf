# TLS front end (specification section 9: "All traffic encrypted (TLS)").
#
# Used instead of nginx.conf when certificates are mounted. Section 11 assumes
# "a server host with a public domain and TLS certificate is available for the
# relay", so this expects real certificates at the paths below - see
# docs/DEPLOYMENT.md for obtaining them.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Certificate renewal needs to reach this over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Behind the host's own proxy, $remote_addr is that proxy. Believe a
    # forwarded address only when it arrives from a private range, and take
    # the last one that is not private: that is the real client. Without
    # this, $remote_addr - and therefore the X-Forwarded-For sent to the
    # relay below, and everything that rate-limits or logs on it - is the
    # same upstream address for every single visitor, the exact bug already
    # found and fixed in the relay's guest WebSocket rate limiting. This file
    # is the config actually deployed to production (nginx.conf's copy of
    # this block is for the non-TLS path) and was missing it entirely.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    # Cloudflare's own edge, fronting this deployment per the UFW rules
    # allowlisting it on 80/443 - without these, a connection arriving
    # directly from Cloudflare (not through another private-range proxy
    # first) was trusted by none of the ranges above, so real_ip never fired
    # for it at all. List from https://www.cloudflare.com/ips-v4 and
    # https://www.cloudflare.com/ips-v6 (2026-10-29); Cloudflare rarely
    # changes this, but it is worth re-checking occasionally.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Modern profile: TLS 1.2 and 1.3 only, and let the client choose among
    # the ciphers it prefers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A session carries a screen and keystrokes: it must never be downgraded.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://relay:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, not append: the relay rate-limits on this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A session stays open for hours and streams continuously.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
