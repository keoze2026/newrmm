# WebSocket upgrades need Connection: upgrade, but a plain request must not
# carry it - so the value is derived from the request rather than hard-coded.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Behind the host's own proxy, $remote_addr is that proxy. Believe a
    # forwarded address only when it arrives from a private range, and take the
    # last one that is not private: that is the real client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    # Cloudflare's own edge, fronting this deployment per the UFW rules
    # allowlisting it on 80/443 - without these, a connection arriving
    # directly from Cloudflare (not through another private-range proxy
    # first) was trusted by none of the ranges above, so real_ip never fired
    # for it at all. List from https://www.cloudflare.com/ips-v4 and
    # https://www.cloudflare.com/ips-v6 (2026-10-29); Cloudflare rarely
    # changes this, but it is worth re-checking occasionally.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Frames are large; do not let nginx buffer the whole body.
    client_max_body_size 512m;

    # Console: a single-page app, so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Relay API and session transport, on the same origin as the console.
    location /api/ {
        proxy_pass http://relay:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: the relay rate-limits on the first
        # entry, so a client-supplied header must never survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A session stays open for hours and streams continuously.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
