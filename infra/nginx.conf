# WebSocket upgrades need Connection: upgrade, but a plain request must not
# carry it - so the value is derived from the request rather than hard-coded.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frames are large; do not let nginx buffer the whole body.
    client_max_body_size 512m;

    # Console: a single-page app, so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Relay API and session transport, on the same origin as the console.
    location /api/ {
        proxy_pass http://relay:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A session stays open for hours and streams continuously.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
