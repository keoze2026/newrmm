# WebSocket upgrades need Connection: upgrade, but a plain request must not
# carry it - so the value is derived from the request rather than hard-coded.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Behind the host's own proxy, $remote_addr is that proxy. Believe a
    # forwarded address only when it arrives from a private range, and take the
    # last one that is not private: that is the real client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Frames are large; do not let nginx buffer the whole body.
    client_max_body_size 512m;

    # Console: a single-page app, so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Relay API and session transport, on the same origin as the console.
    location /api/ {
        proxy_pass http://relay:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: the relay rate-limits on the first
        # entry, so a client-supplied header must never survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A session stays open for hours and streams continuously.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
