name: rdp-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rdp_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rdp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rdp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  relay:
    build:
      context: ../relay
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rdp}:${POSTGRES_PASSWORD:-rdp_dev_pass}@postgres:5432/${POSTGRES_DB:-rdp}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_DIR: /var/log/rmm-relay
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Operator login-token lifetime in minutes. The value lives in infra/.env
      # (ACCESS_TOKEN_MINUTES=525600 = 1 year) so it survives restarts AND git
      # pulls; the default here (480 = 8h) matches config.py. Made permanent
      # 2026-11-18 - the 2026-11-13 override file was a temp fix that a restart
      # wiped (lesson: a temp override is folded in the same session).
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
    volumes:
      # Persistent operational logging (Phase 6): a restart must not lose it.
      - relaylogs:/var/log/rmm-relay
      # Connectors built by CI, served to guests at /api/connector.
      - ../agent/dist:/agent/dist:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run on start so a fresh deployment comes up with a valid schema.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    build:
      context: ..
      dockerfile: console/Dockerfile
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  relaylogs:
