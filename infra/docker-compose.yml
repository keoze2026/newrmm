name: rdp-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rdp_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rdp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rdp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  relay:
    build:
      context: ../relay
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rdp}:${POSTGRES_PASSWORD:-rdp_dev_pass}@postgres:5432/${POSTGRES_DB:-rdp}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run on start so a fresh deployment comes up with a valid schema.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    build:
      context: ..
      dockerfile: console/Dockerfile
    depends_on:
      - relay
    ports:
      - "${CONSOLE_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
